<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Atoompje">
  <defs>
    <radialGradient id="kern" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset=".55" stop-color="#f2792b"/>
      <stop offset="1" stop-color="#e0383e"/>
    </radialGradient>
    <linearGradient id="achter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4ef"/>
    </linearGradient>
    <path id="baan" d="M16,60 a44,16 0 1,0 88,0 a44,16 0 1,0 -88,0"/>
  </defs>

  <!-- achtergrond -->
  <circle cx="60" cy="60" r="58" fill="url(#achter)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#dcefe9" stroke-width="3"/>

  <!-- drie elektronbanen met rondcirkelende elektronen -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <g transform="rotate(0 60 60)">
      <use href="#baan" stroke="#4f86d6"/>
      <circle r="6.5" fill="#f4c21b" stroke="#fff" stroke-width="2.5">
        <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#baan"/></animateMotion>
      </circle>
    </g>
    <g transform="rotate(60 60 60)">
      <use href="#baan" stroke="#6b3fa0"/>
      <circle r="6.5" fill="#e86aa0" stroke="#fff" stroke-width="2.5">
        <animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#baan"/></animateMotion>
      </circle>
    </g>
    <g transform="rotate(120 60 60)">
      <use href="#baan" stroke="#6fae3a"/>
      <circle r="6.5" fill="#33a0e0" stroke="#fff" stroke-width="2.5">
        <animateMotion dur="3.2s" begin="-2.2s" repeatCount="indefinite"><mpath href="#baan"/></animateMotion>
      </circle>
    </g>
  </g>

  <!-- kern met gezichtje -->
  <circle cx="60" cy="60" r="20" fill="url(#kern)" stroke="#fff" stroke-width="3"/>
  <ellipse cx="53" cy="51" rx="5" ry="3" fill="#fff" opacity=".55"/>
  <ellipse cx="53.5" cy="59" rx="2.6" ry="3.2" fill="#1d2f5a"/>
  <ellipse cx="66.5" cy="59" rx="2.6" ry="3.2" fill="#1d2f5a"/>
  <circle cx="54.3" cy="57.9" r=".9" fill="#fff"/>
  <circle cx="67.3" cy="57.9" r=".9" fill="#fff"/>
  <ellipse cx="48.5" cy="65" rx="3.2" ry="2" fill="#ff9fb5" opacity=".85"/>
  <ellipse cx="71.5" cy="65" rx="3.2" ry="2" fill="#ff9fb5" opacity=".85"/>
  <path d="M54.5,65.5 Q60,71 65.5,65.5" fill="none" stroke="#1d2f5a" stroke-width="2.4" stroke-linecap="round"/>
</svg>
